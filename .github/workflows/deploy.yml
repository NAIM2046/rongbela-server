name: Deploy Server to VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          # Generate a unique version tag
          VERSION="v$(date +%Y%m%d)-${GITHUB_SHA::7}"
          # Build using your Dockerfile.prod
          docker build -f Dockerfile.prod -t karutw-server:latest -t karutw-server:$VERSION .
          # Save image to a temporary file for streaming
          docker save karutw-server:latest karutw-server:$VERSION > server_image.tar

      - name: Stream and Load to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "server_image.tar"
          target: "/tmp"

      - name: Execute Remote Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Load the image from the temp file
            docker load < /tmp/server_image.tar
            rm /tmp/server_image.tar
            
            # 2. Restart the container
            cd /var/www/projects/karutw
            docker compose -f docker-compose.prod.yml up -d karutw-server
            
            # 3. Cleanup: Keep only last 3 versions to save 50GB disk space
            docker images --format '{{.Repository}}:{{.Tag}}' | grep karutw-server | tail -n +4 | xargs -r docker rmi