name: Deploy Server to VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          VERSION="v$(date +%Y%m%d)-${GITHUB_SHA::7}"
          # Build normally
          docker build -f Dockerfile.prod -t karutw-server:latest -t karutw-server:$VERSION .

      - name: Direct Stream to VPS
        run: |
          # 1. Setup the SSH Key locally on the GitHub Runner
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # 2. THE MAGIC PIPE
          # We 'save' the image and 'pipe' it directly over SSH to the 'docker load' command.
          # This skips the temporary .tar file and scp entirely.
          docker save karutw-server:latest | ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 root@${{ secrets.HOST }} "docker load"

      - name: Execute Remote Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/projects/karutw
            docker compose -f docker-compose.prod.yml up -d karutw-server
            docker image prune -f # Keep that 50GB disk clean